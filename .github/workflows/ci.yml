name: CI Gates

on:
  push:
    branches:
      - main
      - develop-agent
      - "release/**"
  pull_request:
    branches:
      - main
      - develop-agent
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.100.0 toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check scoped PR trust boundary
        if: github.event_name == 'pull_request'
        run: cargo xtask check-trust-boundary --base "origin/${GITHUB_BASE_REF}"

      - name: Run full verification suite
        run: cargo xtask verify --force

      - name: Package deterministic service artifact
        run: cargo xtask package --out dist

      - name: Upload verification and release manifest receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-verification-evidence
          if-no-files-found: error
          path: |
            evidence/verification.json
            dist/release-manifest.json
