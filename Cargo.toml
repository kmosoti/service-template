[workspace]
resolver = "3"
members = [
    "crates/engine-core",
    "crates/engine-service",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
codegen-units = 1
lto = "thin"
panic = "abort"
